# Production docker-compose.
# Использует образ из registry, собранный через: make build-push REGISTRY=...
#
# Быстрый старт:
#   cp config/misago.env.example config/misago.env  # заполни переменные
#   echo "MISAGO_IMAGE=registry.lab.tk-sputnik.org/sputnik:latest" > .env
#   docker compose up -d

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    networks:
      - misago
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-misago}
      - POSTGRES_USER=${POSTGRES_USER:-misago}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: unless-stopped
    networks:
      - misago
    volumes:
      - redis-data:/data

  misago:
    image: ${MISAGO_IMAGE:?MISAGO_IMAGE is required, e.g. registry.example.com/misago:latest}
    restart: unless-stopped
    networks:
      - misago
    env_file:
      - ./config/misago.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./media:/app/devproject/media
      - ./static:/app/devproject/static
      - ./userdata:/app/devproject/userdata
      - ./logs:/app/logs

  celery-worker:
    image: ${MISAGO_IMAGE:?MISAGO_IMAGE is required}
    command: celery -A devproject worker --loglevel=info
    restart: unless-stopped
    networks:
      - misago
    env_file:
      - ./config/misago.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./media:/app/devproject/media
      - ./logs:/app/logs

  cron:
    image: ${MISAGO_IMAGE:?MISAGO_IMAGE is required}
    entrypoint: []
    command: >
      bash -c "while true; do
        /app/maintenance.sh >> /app/logs/maintenance.log 2>&1
        sleep 86400
      done"
    restart: unless-stopped
    networks:
      - misago
    env_file:
      - ./config/misago.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./media:/app/devproject/media
      - ./logs:/app/logs

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - misago
    ports:
      - "80:80"
    depends_on:
      - misago
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/devproject/static:ro
      - ./media:/app/devproject/media:ro

networks:
  misago:

volumes:
  postgres-data:
  redis-data:
